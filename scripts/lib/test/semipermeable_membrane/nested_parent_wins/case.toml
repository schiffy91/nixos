name = "nested_parent_wins"
runs = ["reset"]
spec = [
  "@home\t/home\t/home/alex/Downloads\tdirectory",
  "@home\t/home\t/home/alex/Downloads/nested/file.txt\tfile",
]
volumes = [
  "@home=/tmp/semipermeable_membrane-home-not-mounted",
]

[clean]
"@home/alex/Downloads/clean.txt" = "clean\n"

[live]
"@home/alex/Downloads/clean.txt" = "user clean\n"
"@home/alex/Downloads/nested/file.txt" = "nested\n"

[expect]
subvolumes = [
  "@persist/dirs/home!alex!Downloads",
]
files = [
  "@persist/dirs/home!alex!Downloads/clean.txt=user clean\n",
  "@persist/dirs/home!alex!Downloads/nested/file.txt=nested\n",
]
missing = [
  "@persist/.semipermeable_membrane/files/home!alex!Downloads!nested!file.txt",
  "@home/alex/Downloads/nested/file.txt",
  "@snapshots/@home/NEXT",
]
direct_mounts = [
  "@persist/dirs/home!alex!Downloads:nested/file.txt",
]
