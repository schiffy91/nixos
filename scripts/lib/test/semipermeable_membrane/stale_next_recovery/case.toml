name = "stale_next_recovery"
runs = ["reset"]
setup_subvolumes = [
  "@snapshots/@home/NEXT",
]
spec = [
  "@home\t/home\t/home/alex/.bash_history\tfile",
]
volumes = [
  "@home=/tmp/semipermeable_membrane-home-not-mounted",
]

[clean]
"@home/alex/.bash_history" = "clean history\n"
"@home/alex/base" = "clean base\n"

[live]
"@home/alex/.bash_history" = "user history\n"
"@home/alex/base" = "user base\n"
"@home/alex/session" = "session\n"

[setup]
"@snapshots/@home/NEXT/stale" = "stale\n"

[expect]
subvolumes = [
  "@snapshots/@home/A",
]
readonly = [
  "@snapshots/@home/A",
]
files = [
  "@home/alex/.bash_history=user history\n",
  "@home/alex/base=clean base\n",
]
missing = [
  "@home/alex/session",
  "@snapshots/@home/NEXT",
]
