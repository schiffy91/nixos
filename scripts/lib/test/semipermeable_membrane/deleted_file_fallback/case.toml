name = "deleted_file_fallback"
runs = ["reset"]
spec = [
  "@home\t/home\t/home/alex/.bash_history\tfile",
]
volumes = [
  "@home=/tmp/semipermeable_membrane-home-not-mounted",
]

[clean]
"@home/alex/.bash_history" = "clean history\n"

[live]
"@home/alex/.bash_history" = "delete"
"@home/alex/session" = "session\n"

[expect]
subvolumes = [
  "@persist/.semipermeable_membrane/files",
  "@snapshots/@home/A",
]
readonly = [
  "@snapshots/@home/A",
]
files = [
  "@persist/.semipermeable_membrane/files/home!alex!.bash_history=clean history\n",
  "@home/alex/.bash_history=clean history\n",
]
missing = [
  "@home/alex/session",
  "@snapshots/@home/NEXT",
]
