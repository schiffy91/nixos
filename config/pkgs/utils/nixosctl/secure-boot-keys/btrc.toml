manifest-version = 1

[package]
name = "nixos_secure_boot_keys"
exports = ["Archive", "Files", "Crypto"]

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Files", "Main"]

[[native.bindings]]
module = "Main"
header = "files.h"
language = "c"
standard = "c11"
symbols = ["keyFilesDisableDumps"]

[[native.bindings]]
module = "Files"
header = "files.h"
language = "c"
standard = "c11"
symbols = [
    "KeySignalGuardHandle",
    "KeyBytesHandle",
    "KeyTextHandle",
    "keySignalGuardAcquire",
    "keySignalGuardClose",
    "keySignalGuardRelease",
    "keyFilesStdinIsTty",
    "keyFilesOpenInitialDirectory",
    "keyFilesStepDirectory",
    "keyFilesCloseDescriptor",
    "keyBytesRelease",
    "keyBytesData",
    "keyBytesLength",
    "keyBytesError",
    "keyFilesReadStdin",
    "keyFilesReadMember",
    "keyFilesWriteStdoutHex",
    "keyTextRelease",
    "keyTextValue",
    "keyFilesStagingName",
    "keyFilesDestinationAbsent",
    "keyFilesCreateStagingRoot",
    "keyFilesWriteStagedMemberHex",
    "keyFilesPublishStaged",
    "keyFilesSyncDirectory",
    "keyFilesRemoveStagedFile",
    "keyFilesRemoveStagedDirectory"
]
owned-results = [
    "keySignalGuardAcquire",
    "keyFilesReadStdin",
    "keyFilesReadMember",
    "keyFilesStagingName"
]
read-only-borrows = [
    "keyFilesStepDirectory.part",
    "keyFilesReadMember.name",
    "keyFilesWriteStdoutHex.hex",
    "keyFilesDestinationAbsent.name",
    "keyFilesCreateStagingRoot.staged",
    "keyFilesWriteStagedMemberHex.name",
    "keyFilesWriteStagedMemberHex.hex",
    "keyFilesPublishStaged.staged",
    "keyFilesPublishStaged.name",
    "keyFilesRemoveStagedFile.member",
    "keyFilesRemoveStagedDirectory.directory"
]
borrowed-parameters = [
    "keySignalGuardClose.guard",
    "keyBytesData.handle",
    "keyBytesLength.handle",
    "keyBytesError.handle",
    "keyTextValue.handle"
]

[native.bindings.resources.KeySignalGuardHandle]
ownership = "unique"
release = "keySignalGuardRelease"

[native.bindings.resources.KeyBytesHandle]
ownership = "unique"
release = "keyBytesRelease"

[native.bindings.resources.KeyTextHandle]
ownership = "unique"
release = "keyTextRelease"

[native.bindings.copied-results.keyBytesData]
kind = "bytes"
owner = "handle"
length-function = "keyBytesLength"
length-arguments = ["handle"]
length-preserves-result = true

[native.bindings.copied-results.keyTextValue]
kind = "string"
owner = "handle"

[[native.pkg-config]]
name = "libcrypto"
modules = ["Crypto"]

[[native.defines]]
name = "_POSIX_C_SOURCE"
value = "200809L"
modules = ["Crypto"]

[[native.bindings]]
module = "Crypto"
header = "crypto.h"
language = "c"
standard = "c11"
symbols = ["SecureBootPrivateKey", "SecureBootCertificate", "secureBootVerificationDeadline", "secureBootVerificationFinished", "secureBootPrivateKeyRead", "secureBootPrivateKeyRelease", "secureBootPrivateKeyValid", "secureBootCertificateRead", "secureBootCertificateRelease", "secureBootKeyMatches", "secureBootCertificateFingerprint"]
owned-results = ["secureBootPrivateKeyRead", "secureBootCertificateRead"]
read-only-borrows = ["secureBootPrivateKeyRead.hex", "secureBootCertificateRead.hex"]
borrowed-parameters = ["secureBootPrivateKeyValid.key", "secureBootKeyMatches.key", "secureBootKeyMatches.certificate", "secureBootCertificateFingerprint.certificate"]

[native.bindings.resources.SecureBootPrivateKey]
ownership = "unique"
release = "secureBootPrivateKeyRelease"

[native.bindings.resources.SecureBootCertificate]
ownership = "unique"
release = "secureBootCertificateRelease"

[native.bindings.copied-results.secureBootCertificateFingerprint]
kind = "string"
owner = "certificate"
