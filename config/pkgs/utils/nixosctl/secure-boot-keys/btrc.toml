manifest-version = 1

[package]
name = "nixos_secure_boot_keys"
exports = ["Archive", "Files", "Crypto"]

[[native.bindings]]
module = "Files"
header = "files.h"
language = "c"
standard = "c11"
symbols = ["RENAME_NOREPLACE", "PR_SET_DUMPABLE", "sigset_t", "sigprocmask"]

[[native.pkg-config]]
name = "libcrypto"
modules = ["Crypto"]

[[native.defines]]
name = "_POSIX_C_SOURCE"
value = "200809L"
modules = ["Crypto"]

[[native.bindings]]
module = "Crypto"
header = "crypto.h"
language = "c"
standard = "c11"
symbols = ["SecureBootPrivateKey", "SecureBootCertificate", "secureBootVerificationDeadline", "secureBootVerificationFinished", "secureBootPrivateKeyRead", "secureBootPrivateKeyRelease", "secureBootPrivateKeyValid", "secureBootCertificateRead", "secureBootCertificateRelease", "secureBootKeyMatches", "secureBootCertificateFingerprint"]
owned-results = ["secureBootPrivateKeyRead", "secureBootCertificateRead"]
read-only-borrows = ["secureBootPrivateKeyRead.bytes", "secureBootCertificateRead.bytes"]
borrowed-parameters = ["secureBootPrivateKeyValid.key", "secureBootKeyMatches.key", "secureBootKeyMatches.certificate", "secureBootCertificateFingerprint.certificate"]

[native.bindings.resources.SecureBootPrivateKey]
ownership = "unique"
release = "secureBootPrivateKeyRelease"

[native.bindings.resources.SecureBootCertificate]
ownership = "unique"
release = "secureBootCertificateRelease"

[native.bindings.copied-results.secureBootCertificateFingerprint]
kind = "string"
owner = "certificate"
