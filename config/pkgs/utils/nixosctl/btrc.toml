manifest-version = 1

[package]
name = "nixosctl"
exports = [
    "lib.Installer",
    "lib.NixosConfig",
    "lib.PasswordChange",
    "lib.PasswordManager",
    "lib.PasswordPrompts",
    "lib.RootSecretFile",
    "lib.SecretsManager",
    "lib.accounts.UserAccount",
    "lib.core.Interactive",
    "lib.core.NixosLog",
    "lib.core.NixosPaths",
    "lib.desktop.PowerManager",
    "lib.hardware.SecureBootVerification",
    "lib.simulator.qemu.VmProvisioner",
    "lib.simulator.spec.ShellStatements",
    "lib.simulator.spec.VmSpecParser"
]

[[native.bindings]]
module = "lib.accounts.UserAccount"
header = "lib/accounts/native.h"
language = "c"
standard = "c11"
symbols = ["UserAccountRecord", "userAccountFind", "userAccountRelease", "userAccountName", "userAccountHome", "userAccountIsCurrent", "userAccountUid", "userAccountGid"]
owned-results = ["userAccountFind"]
read-only-borrows = ["userAccountFind.name"]
borrowed-parameters = ["userAccountName.account", "userAccountHome.account", "userAccountIsCurrent.account", "userAccountUid.account", "userAccountGid.account"]

[native.bindings.resources.UserAccountRecord]
ownership = "unique"
release = "userAccountRelease"

[native.bindings.copied-results.userAccountName]
kind = "string"
owner = "account"

[native.bindings.copied-results.userAccountHome]
kind = "string"
owner = "account"

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["lib.RootSecretFile", "lib.PasswordHashFile", "lib.PasswordManager"]

[[native.defines]]
name = "_POSIX_C_SOURCE"
value = "200809L"
modules = ["lib.accounts.UserAccount", "lib.RootSecretFile", "lib.PasswordHashFile", "lib.PasswordManager"]

[[native.libraries]]
name = "crypt"
modules = ["lib.PasswordManager"]

[[native.bindings]]
module = "lib.PasswordManager"
header = "lib/password-hash.h"
language = "c"
standard = "c11"
symbols = ["credentialHashMatches"]
read-only-borrows = ["credentialHashMatches.hash", "credentialHashMatches.password"]

[[native.bindings]]
module = "lib.RootSecretFile"
header = "lib/credentials.h"
language = "c"
standard = "c11"
symbols = ["credentialRootDirectory", "credentialPublicMarkerValid", "credentialPublicMarkerCreate"]
read-only-borrows = ["credentialRootDirectory.path", "credentialPublicMarkerValid.path", "credentialPublicMarkerCreate.path"]

[[native.bindings]]
module = "lib.PasswordHashFile"
header = "lib/credentials.h"
language = "c"
standard = "c11"
symbols = ["AccountHashHandle", "accountHashSupported", "accountHashRead", "accountHashRelease", "accountHashValue"]
owned-results = ["accountHashRead"]
read-only-borrows = ["accountHashRead.user"]
borrowed-parameters = ["accountHashValue.account"]

[native.bindings.resources.AccountHashHandle]
ownership = "unique"
release = "accountHashRelease"

[native.bindings.copied-results.accountHashValue]
kind = "string"
owner = "account"
