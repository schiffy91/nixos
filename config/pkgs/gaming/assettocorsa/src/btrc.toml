manifest-version = 1

[package]
name = "nixos_assettocorsa"
exports = ["Assetto", "AssettoMods", "ContentManager", "ContentDirectory", "PresetLinks", "GameSettings", "ControlBindings"]

[[native.pkg-config]]
name = "zlib"
modules = ["ContentManager"]

[[native.libraries]]
name = "lzf"
modules = ["ContentManager"]

[[native.bindings]]
module = "ContentManager"
header = "compression.h"
language = "c"
standard = "c11"
symbols = [
    "ContentSettingsHandle",
    "contentSettingsDecodeHex",
    "contentSettingsPackLzf",
    "contentSettingsPackDeflate",
    "contentSettingsRelease",
    "contentSettingsText",
    "contentSettingsBytes",
    "contentSettingsLength"
]

owned-results = ["contentSettingsDecodeHex", "contentSettingsPackLzf", "contentSettingsPackDeflate"]
read-only-borrows = ["contentSettingsDecodeHex.hex", "contentSettingsPackLzf.text", "contentSettingsPackDeflate.text"]
borrowed-parameters = ["contentSettingsText.settings", "contentSettingsBytes.settings", "contentSettingsLength.settings"]

[native.bindings.resources.ContentSettingsHandle]
ownership = "unique"
release = "contentSettingsRelease"

[native.bindings.copied-results.contentSettingsText]
kind = "string"
owner = "settings"

[native.bindings.copied-results.contentSettingsBytes]
kind = "bytes"
owner = "settings"
length-function = "contentSettingsLength"
length-arguments = ["settings"]
length-preserves-result = true
