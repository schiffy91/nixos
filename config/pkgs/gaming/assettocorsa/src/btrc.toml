manifest-version = 1

[package]
name = "nixos_assettocorsa"
exports = ["Assetto", "AssettoMods", "ContentManager", "ContentDirectory", "PresetLinks", "GameSettings", "ControlBindings"]

[[native.pkg-config]]
name = "zlib"
modules = ["ContentManager"]

[[native.bindings]]
module = "ContentManager"
header = "compression.h"
language = "c"
standard = "c11"
symbols = ["compress2", "cmZlibOk", "cmLzfCompress", "ContentSettingsHandle", "contentSettingsDecode", "contentSettingsRelease", "contentSettingsText"]

owned-results = ["contentSettingsDecode"]
read-only-borrows = ["contentSettingsDecode.input"]
borrowed-parameters = ["contentSettingsText.settings"]

[native.bindings.resources.ContentSettingsHandle]
ownership = "unique"
release = "contentSettingsRelease"

[native.bindings.copied-results.contentSettingsText]
kind = "string"
owner = "settings"
