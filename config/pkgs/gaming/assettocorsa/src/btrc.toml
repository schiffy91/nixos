manifest-version = 1

[package]
name = "nixos_assettocorsa"
exports = ["Assetto", "AssettoMods", "ContentManager", "ContentDirectory", "PresetLinks", "GameSettings", "ControlBindings"]

[[native.pkg-config]]
name = "zlib"
modules = ["ContentManager"]

[[native.bindings]]
module = "ContentManager"
header = "compression.h"
language = "c"
standard = "c11"
symbols = ["z_stream", "inflateInit2_", "inflate", "inflateEnd", "zlibVersion", "compress2", "cmZlibOk", "cmZlibFinish", "cmZlibStreamEnd"]
