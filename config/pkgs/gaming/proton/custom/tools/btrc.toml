manifest-version = 1

[package]
name = "nixos_proton_custom_tools"
exports = ["Capture", "Context", "Main", "Runtime", "Sources", "Wine"]

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Runtime", "Capture"]

[[native.bindings]]
module = "Runtime"
header = "native.h"
language = "c"
standard = "c11"
symbols = [
    "ProtonLaunchPlan",
    "protonLaunchCreate",
    "protonLaunchAddArg",
    "protonLaunchAddEnv",
    "protonLaunchStart",
    "protonLaunchRelease",
    "protonPollChild",
    "protonKillProcess",
    "protonReapChild",
    "protonParentPid",
    "protonIsInterrupted"
]
owned-results = ["protonLaunchCreate"]
read-only-borrows = [
    "protonLaunchCreate.executable",
    "protonLaunchCreate.directory",
    "protonLaunchCreate.log",
    "protonLaunchAddArg.argument",
    "protonLaunchAddEnv.entry"
]
borrowed-parameters = [
    "protonLaunchAddArg.plan",
    "protonLaunchAddEnv.plan",
    "protonLaunchStart.plan"
]

[native.bindings.resources.ProtonLaunchPlan]
ownership = "unique"
release = "protonLaunchRelease"

[[native.bindings]]
module = "Capture"
header = "native.h"
language = "c"
standard = "c11"
symbols = ["protonForkChild", "protonExitChild", "protonStopChild"]
