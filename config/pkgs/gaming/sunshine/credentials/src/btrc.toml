manifest-version = 1

[package]
name = "nixos_sunshine_credentials"
exports = ["Credentials"]

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Credentials", "Main"]

[[native.bindings]]
module = "Credentials"
header = "native.h"
language = "c"
standard = "c11"
symbols = [
    "SunshineBytesHandle",
    "SunshineTextHandle",
    "sunshineBytesRelease",
    "sunshineBytesStatus",
    "sunshineBytesData",
    "sunshineBytesLength",
    "sunshineTextRelease",
    "sunshineTextValue",
    "sunshineGenerateSalt",
    "sunshineReadDescriptor",
    "sunshineReadStdin",
    "sunshineOpenStoreDir",
    "sunshineVerifySameDir",
    "sunshineReadLegacyState",
    "sunshineCloseDescriptor"
]
owned-results = [
    "sunshineGenerateSalt",
    "sunshineReadDescriptor",
    "sunshineReadStdin",
    "sunshineReadLegacyState"
]
read-only-borrows = [
    "sunshineOpenStoreDir.path",
    "sunshineVerifySameDir.path"
]
borrowed-parameters = [
    "sunshineBytesStatus.handle",
    "sunshineBytesData.handle",
    "sunshineBytesLength.handle",
    "sunshineTextValue.handle"
]

[native.bindings.resources.SunshineBytesHandle]
ownership = "unique"
release = "sunshineBytesRelease"

[native.bindings.resources.SunshineTextHandle]
ownership = "unique"
release = "sunshineTextRelease"

[native.bindings.copied-results.sunshineBytesData]
kind = "bytes"
owner = "handle"
length-function = "sunshineBytesLength"
length-arguments = ["handle"]
length-preserves-result = true

[native.bindings.copied-results.sunshineTextValue]
kind = "string"
owner = "handle"

[[native.bindings]]
module = "Main"
header = "native.h"
language = "c"
standard = "c11"
symbols = [
    "sunshinePrepareProcess",
    "sunshineAccountMatchesCurrentUid"
]
read-only-borrows = ["sunshineAccountMatchesCurrentUid.username"]
