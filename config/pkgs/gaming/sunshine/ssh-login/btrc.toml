manifest-version = 1

[package]
name = "nixos_sunshine_ssh_login"
exports = ["Client"]

[[native.pkg-config]]
name = "libcurl"
modules = ["Client"]

[[native.pkg-config]]
name = "openssl"
modules = ["Client"]

[[native.bindings]]
module = "Client"
header = "native.h"
language = "c"
standard = "c11"
symbols = [
    "SunshineHttpResponseHandle",
    "sunshineHttpsPost",
    "sunshineHttpResponseRelease",
    "sunshineHttpResponseStatus",
    "sunshineHttpResponseCode",
    "sunshineHttpResponseBytes",
    "sunshineHttpResponseLength"
]
owned-results = ["sunshineHttpsPost"]
read-only-borrows = [
    "sunshineHttpsPost.url",
    "sunshineHttpsPost.body",
    "sunshineHttpsPost.certificate"
]
borrowed-parameters = [
    "sunshineHttpResponseStatus.response",
    "sunshineHttpResponseCode.response",
    "sunshineHttpResponseBytes.response",
    "sunshineHttpResponseLength.response"
]

[native.bindings.resources.SunshineHttpResponseHandle]
ownership = "unique"
release = "sunshineHttpResponseRelease"

[native.bindings.copied-results.sunshineHttpResponseBytes]
kind = "bytes"
owner = "response"
length-function = "sunshineHttpResponseLength"
length-arguments = ["response"]
length-preserves-result = true
