manifest-version = 1

[package]
name = "nixos_deckpad"
exports = [
    "Wire",
    "PadState",
    "PadSource",
    "DeckPad",
    "SteamController",
    "Controller",
    "ControllerUSB",
    "Link",
    "Protocol",
    "Trust",
    "SecureRelay",
    "NetworkLink",
    "GadgetLink",
    "BluetoothLink",
    "Service",
    "Control",
    "Host",
    "Doctor"
]

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["DeckPad", "Service", "Host", "Doctor", "Main", "Screen"]
os = ["linux"]

[[native.pkg-config]]
name = "x11"
modules = ["Screen"]
os = ["linux"]

[[native.bindings]]
module = "Screen"
header = "Screen.h"
language = "c"
standard = "c11"
symbols = [
    "DeckScreenHandle",
    "deckScreenOpen",
    "deckScreenAddNoticeHex",
    "deckScreenEvents",
    "deckScreenPaint",
    "deckScreenDescriptor",
    "deckScreenShutdown",
    "deckScreenClose"
]
owned-results = ["deckScreenOpen"]
read-only-borrows = ["deckScreenOpen.title", "deckScreenAddNoticeHex.hex"]
borrowed-parameters = [
    "deckScreenAddNoticeHex.screen",
    "deckScreenEvents.screen",
    "deckScreenPaint.screen",
    "deckScreenDescriptor.screen",
    "deckScreenShutdown.screen"
]
os = ["linux"]

[native.bindings.resources.DeckScreenHandle]
ownership = "unique"
release = "deckScreenClose"

[[native.bindings]]
module = "Screen"
header = "Posix.h"
language = "c"
standard = "c11"
symbols = ["deckBlockStopSignals", "deckStopSignalled"]
os = ["linux"]

[[native.bindings]]
module = "Awake"
header = "Awake.h"
language = "c"
standard = "c11"
symbols = ["deckAwakeOpen", "deckAwakeNudge", "deckAwakeClose"]
read-only-borrows = ["deckAwakeOpen.name"]
os = ["linux"]

[[native.bindings]]
module = "DeckPad"
header = "Posix.h"
language = "c"
standard = "c11"
symbols = ["deckTransferTimedOut"]
os = ["linux"]

[[native.bindings]]
module = "Service"
header = "Posix.h"
language = "c"
standard = "c11"
symbols = ["deckBlockStopSignals", "deckStopSignalled"]
os = ["linux"]

[[native.bindings]]
module = "Host"
header = "Posix.h"
language = "c"
standard = "c11"
symbols = [
    "deckTunnelParentPid",
    "deckTunnelFork",
    "deckTunnelParentAlive",
    "deckTunnelExit",
    "deckTunnelWait",
    "deckTunnelTerminate",
    "deckCloseDescriptor",
    "deckConfirmStdinYes"
]
os = ["linux"]

[[native.bindings]]
module = "Doctor"
header = "Posix.h"
language = "c"
standard = "c11"
symbols = [
    "DeckHidrawReportHandle",
    "deckHidrawReportRelease",
    "deckHidrawReportLength",
    "deckHidrawReportBytes",
    "deckOpenHidraw",
    "deckReadHidrawReport",
    "deckCloseDescriptor"
]
owned-results = ["deckReadHidrawReport"]
read-only-borrows = ["deckOpenHidraw.path"]
borrowed-parameters = [
    "deckHidrawReportLength.handle",
    "deckHidrawReportBytes.handle"
]
os = ["linux"]

[native.bindings.resources.DeckHidrawReportHandle]
ownership = "unique"
release = "deckHidrawReportRelease"

[native.bindings.copied-results.deckHidrawReportBytes]
kind = "bytes"
owner = "handle"
length-function = "deckHidrawReportLength"
length-arguments = ["handle"]
length-preserves-result = true

[[native.bindings]]
module = "Main"
header = "Posix.h"
language = "c"
standard = "c11"
symbols = ["deckReadableFile"]
read-only-borrows = ["deckReadableFile.path"]
os = ["linux"]
