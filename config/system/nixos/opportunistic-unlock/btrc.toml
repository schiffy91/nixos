manifest-version = 1

[package]
name = "nixos_opportunistic_unlock"
exports = ["Devices", "Secrets", "LuksVolume", "Worker"]

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Main", "Devices", "Secrets", "LuksVolume", "Worker"]

[[native.pkg-config]]
name = "libcryptsetup"
modules = ["Main", "Devices", "Secrets", "LuksVolume", "Worker"]

[[native.bindings]]
module = "Main"
header = "native.h"
language = "c"
standard = "c11"
symbols = ["unlockQuietCryptsetup"]

[[native.bindings]]
module = "Devices"
header = "native.h"
language = "c"
standard = "c11"
symbols = ["unlockMaxOffset", "unlockBlockDeviceAt", "unlockBlockFdMatches"]
read-only-borrows = ["unlockBlockDeviceAt.path"]

[[native.bindings]]
module = "Secrets"
header = "native.h"
language = "c"
standard = "c11"
symbols = [
    "UnlockSecretHandle",
    "UnlockKeyDescriptionHandle",
    "unlockSecretCreate",
    "unlockSecretRelease",
    "unlockSecretCloseMemory",
    "unlockSecretErase",
    "unlockSecretOpened",
    "unlockSecretLockAfterFork",
    "unlockSecretFill",
    "unlockSecretAllEqual",
    "unlockSecretLoadText",
    "unlockKeyDescriptionRead",
    "unlockKeyDescriptionRelease",
    "unlockKeyDescriptionText",
    "unlockKeyringSearchPassphrase",
    "unlockKeyringReadPassphrase",
    "unlockKeyringRevoke"
]
owned-results = ["unlockSecretCreate", "unlockKeyDescriptionRead"]
read-only-borrows = ["unlockSecretLoadText.text"]
borrowed-parameters = [
    "unlockSecretCloseMemory.secret",
    "unlockSecretErase.secret",
    "unlockSecretOpened.secret",
    "unlockSecretLockAfterFork.secret",
    "unlockSecretFill.secret",
    "unlockSecretAllEqual.secret",
    "unlockSecretLoadText.secret",
    "unlockKeyDescriptionText.description",
    "unlockKeyringReadPassphrase.secret"
]

[native.bindings.resources.UnlockSecretHandle]
ownership = "unique"
release = "unlockSecretRelease"

[native.bindings.resources.UnlockKeyDescriptionHandle]
ownership = "unique"
release = "unlockKeyDescriptionRelease"

[native.bindings.copied-results.unlockKeyDescriptionText]
kind = "string"
owner = "description"

[[native.bindings]]
module = "LuksVolume"
header = "native.h"
language = "c"
standard = "c11"
symbols = [
    "UnlockCryptHandle",
    "UnlockSecretHandle",
    "unlockCryptOpen",
    "unlockCryptRelease",
    "unlockSecretRelease",
    "unlockCryptSoftwareOnly",
    "unlockCryptInactive",
    "unlockCryptKeySize",
    "unlockCryptVerifyKey",
    "unlockCryptActivate",
    "unlockCryptDeactivate",
    "unlockCryptMappingDeviceAt",
    "unlockOpenVolumeDescriptor",
    "unlockCloseDescriptor"
]
owned-results = ["unlockCryptOpen"]
read-only-borrows = [
    "unlockCryptOpen.path",
    "unlockCryptInactive.mapping",
    "unlockCryptActivate.mapping",
    "unlockCryptDeactivate.mapping",
    "unlockCryptMappingDeviceAt.mapping",
    "unlockOpenVolumeDescriptor.path"
]
borrowed-parameters = [
    "unlockCryptSoftwareOnly.handle",
    "unlockCryptInactive.handle",
    "unlockCryptKeySize.handle",
    "unlockCryptVerifyKey.handle",
    "unlockCryptVerifyKey.key",
    "unlockCryptVerifyKey.passphrase",
    "unlockCryptActivate.handle",
    "unlockCryptActivate.key",
    "unlockCryptDeactivate.handle"
]

[native.bindings.resources.UnlockCryptHandle]
ownership = "unique"
release = "unlockCryptRelease"

[native.bindings.resources.UnlockSecretHandle]
ownership = "unique"
release = "unlockSecretRelease"

[[native.bindings]]
module = "Worker"
header = "native.h"
language = "c"
standard = "c11"
symbols = [
    "unlockDisableProcessDumps",
    "unlockPrepareChildLimits",
    "unlockForkProcess",
    "unlockExitProcess",
    "unlockChildRunning",
    "unlockWaitChildSuccess",
    "unlockKillProcess"
]
