manifest-version = 1

[package]
name = "nixos_trusted_connections"
exports = ["TrustedConnections", "NetworkPrefix", "TrustedFirewall"]

[[native.bindings]]
module = "NetworkPrefix"
header = "native.h"
language = "c"
standard = "c11"
symbols = ["NetworkPrefixHandle", "networkPrefixParse", "networkPrefixRelease", "networkPrefixText"]
owned-results = ["networkPrefixParse"]
read-only-borrows = ["networkPrefixParse.address"]
borrowed-parameters = ["networkPrefixText.prefix"]

[native.bindings.resources.NetworkPrefixHandle]
ownership = "unique"
release = "networkPrefixRelease"

[native.bindings.copied-results.networkPrefixText]
kind = "string"
owner = "prefix"
