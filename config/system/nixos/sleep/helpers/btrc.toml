manifest-version = 1

[package]
name = "nixos_sleep_native"
exports = ["Console", "Authentication", "Authenticate", "Display", "Blank"]

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Console", "Authentication", "Authenticate", "Display"]

[[native.bindings]]
module = "Console"
header = "posix.h"
language = "c"
standard = "c11"
symbols = [
    "sleepConsoleOpen",
    "sleepConsoleClose",
    "sleepConsoleActiveVt",
    "sleepConsoleLockSwitch",
    "sleepConsoleUnlockSwitch",
    "sleepConsoleActivate",
    "sleepConsoleWaitActive",
    "sleepConsoleSecureInput",
    "sleepConsoleDiscardInput"
]

[[native.bindings]]
module = "Authenticate"
header = "posix.h"
language = "c"
standard = "c11"
symbols = ["sleepDisableCoreDumps", "sleepDisableProcessDumps"]

[[native.libraries]]
name = "pam"
modules = ["Authentication"]

[[native.bindings]]
module = "Authentication"
header = "pam.h"
language = "c"
standard = "c11"
symbols = [
    "MCL_CURRENT",
    "MCL_FUTURE",
    "PR_SET_PDEATHSIG",
    "mlockall",
    "SleepPasswordHandle",
    "sleepPamMaxResponseSize",
    "sleepPasswordReadPrompt",
    "sleepPasswordClose",
    "sleepPasswordRelease",
    "sleepPasswordLength",
    "sleepPasswordEquals",
    "sleepPamAuthenticate"
]
owned-results = ["sleepPasswordReadPrompt"]
read-only-borrows = [
    "sleepPasswordReadPrompt.executable",
    "sleepPasswordReadPrompt.label",
    "sleepPasswordEquals.expected",
    "sleepPamAuthenticate.user",
    "sleepPamAuthenticate.plymouth"
]
borrowed-parameters = [
    "sleepPasswordClose.password",
    "sleepPasswordLength.password",
    "sleepPasswordEquals.password"
]

[native.bindings.resources.SleepPasswordHandle]
ownership = "unique"
release = "sleepPasswordRelease"

[[native.pkg-config]]
name = "libdrm"
modules = ["Display"]

[[native.bindings]]
module = "Display"
header = "drm.h"
language = "c"
standard = "c11"
symbols = [
    "DisplayCardHandle",
    "displayCardOpen",
    "displayCardBlank",
    "displayCardClose",
    "displayCardRelease"
]
owned-results = ["displayCardOpen"]
read-only-borrows = ["displayCardOpen.path"]
borrowed-parameters = ["displayCardBlank.card", "displayCardClose.card"]

[native.bindings.resources.DisplayCardHandle]
ownership = "unique"
release = "displayCardRelease"
