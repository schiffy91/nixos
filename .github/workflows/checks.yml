name: checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the owner's machines already passed for this exact commit (`ci-local`, ci/local.json): a status
  # `local/<platform>/<job>` posted by the repository's owner stands in for the same job here.
  local:
    runs-on: ubuntu-24.04
    permissions:
      statuses: read
    outputs:
      passed: ${{ steps.statuses.outputs.passed }}
    steps:
      - id: statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100" | jq -c --arg owner "$GITHUB_REPOSITORY_OWNER" '[.[] | select(.creator.login == $owner and (.context | startswith("local/")))] | group_by(.context) | map(max_by(.created_at) | select(.state == "success") | .context)')
          printf 'passed=%s\n' "$passed" | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: local
    if: ${{ !(contains(fromJSON(needs.local.outputs.passed), 'local/linux-x86_64/lint') && contains(fromJSON(needs.local.outputs.passed), 'local/linux-x86_64/checks')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-substituters = ${{ vars.NIXOS_CACHE_URL }}
            extra-trusted-public-keys = ${{ vars.NIXOS_CACHE_PUBLIC_KEY }}
      - name: compiler and workspace errors
        if: ${{ !contains(fromJSON(needs.local.outputs.passed), 'local/linux-x86_64/lint') }}
        run: make lint
      - name: run every check
        if: ${{ !contains(fromJSON(needs.local.outputs.passed), 'local/linux-x86_64/checks') }}
        run: ci/checks.sh
