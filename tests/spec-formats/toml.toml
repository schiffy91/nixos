name = "spec-toml"
parentState = "quick"
stateMaterial = "spec-format:toml:source={{sourceHash}}"

[args]
marker = "toml-ok"

[[operations]]
op = "require-state"

[[operations]]
op = "reset-state"

[[operations]]
op = "host"
command = "test \"{{state}}\" = \"{{name}}\" && test \"{{workDir}}\" = \".vm/e2e/{{name}}\" && test \"{{iso}}\" = \".vm/e2e/iso/nixos-minimal-{{arch}}.iso\" && test -n \"{{isoUrl}}\" && printf derived"
expect = "derived"

[[operations]]
op = "host"
command = "mkdir -p {{workDir}} && printf {{marker}} > {{workDir}}/format.txt"

[[operations]]
op = "host"
command = "cat {{workDir}}/format.txt"
expect = "{{marker}}"

[[operations]]
op = "record-state"
