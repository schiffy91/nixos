manifest-version = 1

[package]
name = "nixos_secure_boot_tests"

[dependencies]
keys = { path = "../../config/pkgs/utils/nixosctl/secure-boot-keys" }

[[native.bindings]]
module = "AlarmState"
header = "alarm-state.h"
language = "c"
standard = "c11"
symbols = ["testIgnoreAndBlockAlarm", "testWaitForSignal", "testAlarmSignal"]

[[native.defines]]
name = "_POSIX_C_SOURCE"
value = "200809L"
modules = ["AlarmState"]
