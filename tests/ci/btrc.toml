manifest-version = 1
[package]
name = "nixos_ci_tests"
[dependencies]
ci = { path = "../../ci" }

[[native.bindings]]
module = "ProcessProbe"
header = "process-probe.h"
language = "c"
standard = "c11"
symbols = ["testReadInputByte", "testInputRemainsOpen", "testProcessExists"]

[[native.defines]]
name = "_POSIX_C_SOURCE"
value = "200809L"
modules = ["ProcessProbe"]
