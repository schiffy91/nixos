manifest-version = 1
[package]
name = "nixos_affinity_tests"

[[native.bindings]]
module = "Affinity"
header = "cpu-set.h"
language = "c"
standard = "c11"
symbols = ["TestCpuSet", "testCpuSetCreate", "testCpuSetDestroy", "testCpuSetCapacity", "testCpuSetContains"]
owned-results = ["testCpuSetCreate"]
borrowed-parameters = ["testCpuSetCapacity.set", "testCpuSetContains.set"]

[native.bindings.resources.TestCpuSet]
ownership = "unique"
release = "testCpuSetDestroy"

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Affinity"]
