name: spec-yaml
parentState: spec-toml
stateMaterial: spec-format:yaml:source={{sourceHash}}
args:
  marker: yaml-ok
operations:
  - op: require-state
  - op: reset-state
  - op: host
    command: test "{{state}}" = "{{name}}" && test "{{workDir}}" = ".vm/e2e/{{name}}" && test "{{iso}}" = ".vm/e2e/iso/nixos-minimal-{{arch}}.iso" && test -n "{{isoUrl}}" && printf derived
    expect: derived
  - op: host
    command: mkdir -p {{workDir}} && printf {{marker}} > {{workDir}}/format.txt
  - op: host
    command: cat {{workDir}}/format.txt
    expect: "{{marker}}"
  - op: record-state
